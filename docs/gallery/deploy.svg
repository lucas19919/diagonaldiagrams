<svg xmlns="http://www.w3.org/2000/svg" role="graphics-document" aria-roledescription="flow diagram" data-legibility="all" viewBox="0 66 428 549" width="428">
<title>Deploy approval</title>
<desc>Yes = right · No = down · diamond &lt;= 3 exits</desc>
<rect width="428" height="615" fill="#f5f4f2" aria-hidden="true"/>
<defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#5e5953"/></marker><marker id="aa" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#e25b2a"/></marker><marker id="al" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#3a3530"/></marker><marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#8c867e"/></marker></defs>
<text x="30" y="30" font-size="22" font-weight="500" font-family="system-ui, 'Segoe UI', sans-serif" fill="#161513" data-size-from="stylesheet 'site', rule 'figure::title'">Deploy approval</text>
<text x="30" y="50" font-size="14" font-family="system-ui, 'Segoe UI', sans-serif" fill="#5e5953" data-size-from="stylesheet 'site', rule 'figure::sub'">Yes = right · No = down · diamond &lt;= 3 exits</text>
<rect x="286" y="78" width="112" height="40" rx="20" fill="#f5f4f2" aria-hidden="true"/>
<rect x="286" y="78" width="112" height="40" rx="20" fill="#f5f4f2" stroke="#2c2824" stroke-width="1" data-node="start" data-label="Push" role="graphics-symbol" aria-roledescription="start or end" aria-label="Push"/>
<text x="342" y="102.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#161513" text-anchor="middle" aria-hidden="true">Push</text>
<rect x="286" y="166" width="112" height="54" rx="0" fill="#f5f4f2" aria-hidden="true"/>
<rect x="286" y="166" width="112" height="54" rx="0" fill="#f5f4f2" stroke="#2c2824" stroke-width="1" data-node="tests" data-label="CI tests" role="graphics-symbol" aria-roledescription="box" aria-label="CI tests, ci: 4 min"/>
<text x="342" y="189.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#161513" text-anchor="middle" aria-hidden="true">CI tests</text>
<text x="342" y="206.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#5e5953" text-anchor="middle" aria-hidden="true">ci: 4 min</text>
<polygon points="342,280 398,314.5 342,349 286,314.5" fill="#f5f4f2" aria-hidden="true"/>
<polygon points="342,280 398,314.5 342,349 286,314.5" fill="rgba(226,91,42,0.12)" stroke="#e25b2a" stroke-width="1" data-node="risk?" data-label="Risky?" data-cx="342" data-cy="314.5" role="graphics-symbol" aria-roledescription="decision" aria-label="Risky?"/>
<text x="342" y="318.8" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#161513" text-anchor="middle" aria-hidden="true">Risky?</text>
<rect x="46" y="404" width="112" height="40" rx="0" fill="#f5f4f2" aria-hidden="true"/>
<rect x="46" y="404" width="112" height="40" rx="0" fill="#f5f4f2" stroke="#2c2824" stroke-width="1" data-node="fix" data-label="Fix" role="graphics-symbol" aria-roledescription="box" aria-label="Fix"/>
<text x="102" y="428.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#161513" text-anchor="middle" aria-hidden="true">Fix</text>
<rect x="286" y="397" width="112" height="54" rx="0" fill="#f5f4f2" aria-hidden="true"/>
<rect x="286" y="397" width="112" height="54" rx="0" fill="#f5f4f2" stroke="#2c2824" stroke-width="1" data-node="review" data-label="Review" role="graphics-symbol" aria-roledescription="box" aria-label="Review, owner:payments"/>
<text x="342" y="420.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#161513" text-anchor="middle" aria-hidden="true">Review</text>
<text x="342" y="437.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#5e5953" text-anchor="middle" aria-hidden="true">owner:payments</text>
<rect x="286" y="511" width="112" height="40" rx="20" fill="#f5f4f2" aria-hidden="true"/>
<rect x="286" y="511" width="112" height="40" rx="20" fill="#f5f4f2" stroke="#2c2824" stroke-width="1" data-node="ship" data-label="Ship" role="graphics-symbol" aria-roledescription="start or end" aria-label="Ship"/>
<text x="342" y="535.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#161513" text-anchor="middle" aria-hidden="true">Ship</text>
<path d="M342,118 L342,166" fill="none" stroke="#e25b2a" stroke-width="1.15" marker-end="url(#aa)" data-from="start" data-to="tests" data-label="push" data-id="start-&gt;tests:push" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Push to CI tests: push"/>
<path d="M342,220 L342,280" fill="none" stroke="#5e5953" stroke-width="1.15" marker-end="url(#a)" data-from="tests" data-to="risk?" data-label="pass" data-id="tests-&gt;risk?:pass" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="CI tests to Risky?: pass"/>
<path d="M342,220 L342,242 Q342,250 334,250 L110,250 Q102,250 102,258 L102,404" fill="none" stroke="#5e5953" stroke-width="1.15" marker-end="url(#a)" data-from="tests" data-to="fix" data-label="fail" data-id="tests-&gt;fix:fail" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="CI tests to Fix: fail"/>
<path d="M342,349 L342,397" fill="none" stroke="#e25b2a" stroke-width="1.15" marker-end="url(#aa)" data-from="risk?" data-to="review" data-label="yes" data-id="risk?-&gt;review:yes" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Risky? to Review: yes"/>
<path d="M286,314.5 L198,314.5 Q190,314.5 190,322.5 L190,473 Q190,481 198,481 L334,481 Q342,481 342,489 L342,511" fill="none" stroke="#5e5953" stroke-width="1.15" marker-end="url(#a)" data-from="risk?" data-to="ship" data-label="no" data-id="risk?-&gt;ship:no" data-from-port="w" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Risky? to Ship: no"/>
<path d="M46,424 L38,424 Q30,424 30,416 L30,201 Q30,193 38,193 L286,193" fill="none" stroke="#5e5953" stroke-width="1.15" marker-end="url(#a)" data-from="fix" data-to="tests" data-label="retry" data-id="fix-&gt;tests:retry" data-from-port="w" data-to-port="w" role="graphics-symbol" aria-roledescription="arrow" aria-label="Fix to CI tests: retry"/>
<path d="M342,451 L342,511" fill="none" stroke="#5e5953" stroke-width="1.15" marker-end="url(#a)" data-from="review" data-to="ship" data-label="approve" data-id="review-&gt;ship:approve" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Review to Ship: approve"/>
<rect x="346" y="133" width="31" height="16" rx="2" fill="#f5f4f2" aria-hidden="true"/>
<text x="361.5" y="145" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#5e5953" text-anchor="middle" aria-hidden="true">push</text>
<rect x="346" y="241" width="31" height="16" rx="2" fill="#f5f4f2" aria-hidden="true"/>
<text x="361.5" y="253" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#5e5953" text-anchor="middle" aria-hidden="true">pass</text>
<rect x="210" y="230" width="24" height="16" rx="2" fill="#f5f4f2" aria-hidden="true"/>
<text x="222" y="242" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#5e5953" text-anchor="middle" aria-hidden="true">fail</text>
<rect x="346" y="364" width="26" height="16" rx="2" fill="#f5f4f2" aria-hidden="true"/>
<text x="359" y="376" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#5e5953" text-anchor="middle" aria-hidden="true">yes</text>
<rect x="194" y="388.75" width="20" height="16" rx="2" fill="#f5f4f2" aria-hidden="true"/>
<text x="204" y="400.75" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#5e5953" text-anchor="middle" aria-hidden="true">no</text>
<rect x="143" y="173" width="30" height="16" rx="2" fill="#f5f4f2" aria-hidden="true"/>
<text x="158" y="185" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#5e5953" text-anchor="middle" aria-hidden="true">retry</text>
<rect x="346" y="472" width="46" height="16" rx="2" fill="#f5f4f2" aria-hidden="true"/>
<text x="369" y="484" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#5e5953" text-anchor="middle" aria-hidden="true">approve</text>
<line x1="30" y1="575" x2="398" y2="575" stroke="rgba(22,21,19,0.12)" stroke-width=".8" aria-hidden="true"/>
<text x="30" y="593" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#5e5953">box = step, diamond = decision, rounded = start or end</text>
</svg>
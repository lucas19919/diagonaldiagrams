<svg xmlns="http://www.w3.org/2000/svg" role="graphics-document" aria-roledescription="flow diagram" data-legibility="all" viewBox="0 0 769 1121" width="769">
<title>A Falcon 9 mission, from countdown to landing</title>
<desc>At stage separation the mission splits: the second stage carries the payload to orbit while the booster flies itself home.</desc>
<rect width="769" height="1121" fill="#f5f5f5" aria-hidden="true"/>
<defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#4f5d75"/></marker><marker id="aa" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#eb6c36"/></marker><marker id="al" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#2e5aa8"/></marker><marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#636c82"/></marker></defs>
<text x="30" y="26" font-size="18" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142">A Falcon 9 mission, from countdown to landing</text>
<text x="30" y="44" font-size="13" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75">At stage separation the mission splits: the second stage carries the payload to orbit while the booster flies itself home.</text>
<rect x="258.5" y="72" width="160" height="54" rx="20" fill="#f5f5f5" aria-hidden="true"/>
<rect x="258.5" y="72" width="160" height="54" rx="20" fill="#ffffff" stroke="#7d8699" data-node="count" data-label="Countdown" role="graphics-symbol" aria-roledescription="start or end" aria-label="Countdown, propellant load, T-35 min"/>
<text x="338.5" y="95.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Countdown</text>
<text x="338.5" y="112.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">propellant load, T-35 min</text>
<polygon points="338.5,174 418.5,208.5 338.5,243 258.5,208.5" fill="#f5f5f5" aria-hidden="true"/>
<polygon points="338.5,174 418.5,208.5 338.5,243 258.5,208.5" fill="#ffffff" stroke="#7d8699" data-node="go" data-label="Go for launch?" data-cx="338.5" data-cy="208.5" role="graphics-symbol" aria-roledescription="decision" aria-label="Go for launch?"/>
<text x="338.5" y="212.8" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Go for launch?</text>
<rect x="466.5" y="291" width="144" height="54" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="466.5" y="291" width="144" height="54" rx="6" fill="#ffffff" stroke="#7d8699" data-node="scrub" data-label="Scrub and recycle" role="graphics-symbol" aria-roledescription="box" aria-label="Scrub and recycle, weather or a sensor"/>
<text x="538.5" y="314.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Scrub and recycle</text>
<text x="538.5" y="331.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">weather or a sensor</text>
<rect x="274.5" y="291" width="128" height="54" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="274.5" y="291" width="128" height="54" rx="6" fill="#ffffff" stroke="#7d8699" data-node="liftoff" data-label="Liftoff" role="graphics-symbol" aria-roledescription="box" aria-label="Liftoff, nine Merlin engines"/>
<text x="338.5" y="314.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Liftoff</text>
<text x="338.5" y="331.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">nine Merlin engines</text>
<rect x="266.5" y="393" width="144" height="54" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="266.5" y="393" width="144" height="54" rx="6" fill="#ffffff" stroke="#7d8699" data-node="maxq" data-label="Max-Q" role="graphics-symbol" aria-roledescription="box" aria-label="Max-Q, peak aerodynamic load"/>
<text x="338.5" y="416.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Max-Q</text>
<text x="338.5" y="433.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">peak aerodynamic load</text>
<rect x="266.5" y="495" width="144" height="54" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="266.5" y="495" width="144" height="54" rx="6" fill="#ffffff" stroke="#7d8699" data-node="meco" data-label="Main engine cutoff" role="graphics-symbol" aria-roledescription="box" aria-label="Main engine cutoff, about T+2:30"/>
<text x="338.5" y="518.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Main engine cutoff</text>
<text x="338.5" y="535.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">about T+2:30</text>
<rect x="266.5" y="597" width="144" height="40" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="266.5" y="597" width="144" height="40" rx="6" fill="#ffffff" stroke="#7d8699" data-node="sep" data-label="Stage separation" role="graphics-symbol" aria-roledescription="box" aria-label="Stage separation"/>
<text x="338.5" y="621.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Stage separation</text>
<rect x="142.5" y="697" width="176" height="54" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="142.5" y="697" width="176" height="54" rx="6" fill="#ffffff" stroke="#7d8699" data-node="ses" data-label="Second-stage ignition" role="graphics-symbol" aria-roledescription="box" aria-label="Second-stage ignition, one Merlin Vacuum"/>
<text x="230.5" y="720.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Second-stage ignition</text>
<text x="230.5" y="737.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">one Merlin Vacuum</text>
<rect x="158.5" y="799" width="144" height="54" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="158.5" y="799" width="144" height="54" rx="6" fill="#ffffff" stroke="#7d8699" data-node="fairing" data-label="Fairing separation" role="graphics-symbol" aria-roledescription="box" aria-label="Fairing separation, halves recovered at sea"/>
<text x="230.5" y="822.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Fairing separation</text>
<text x="230.5" y="839.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">halves recovered at sea</text>
<rect x="150.5" y="901" width="160" height="54" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="150.5" y="901" width="160" height="54" rx="6" fill="#ffffff" stroke="#7d8699" data-node="seco" data-label="Second-stage cutoff" role="graphics-symbol" aria-roledescription="box" aria-label="Second-stage cutoff, parking orbit"/>
<text x="230.5" y="924.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Second-stage cutoff</text>
<text x="230.5" y="941.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">parking orbit</text>
<rect x="158.5" y="1010" width="144" height="40" rx="20" fill="#f5f5f5" aria-hidden="true"/>
<rect x="158.5" y="1010" width="144" height="40" rx="20" fill="#ffffff" stroke="#7d8699" data-node="deploy" data-label="Payload deployed" role="graphics-symbol" aria-roledescription="start or end" aria-label="Payload deployed"/>
<text x="230.5" y="1034.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Payload deployed</text>
<rect x="358.5" y="697" width="176" height="54" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="358.5" y="697" width="176" height="54" rx="6" fill="#ffffff" stroke="#7d8699" data-node="boostback" data-label="Boostback burn" role="graphics-symbol" aria-roledescription="box" aria-label="Boostback burn, turn toward the landing site"/>
<text x="446.5" y="720.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Boostback burn</text>

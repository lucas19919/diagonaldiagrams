<text x="446.5" y="924.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Landing burn</text>
<text x="446.5" y="941.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">one engine, legs out</text>
<rect x="366.5" y="1003" width="160" height="54" rx="20" fill="#f5f5f5" aria-hidden="true"/>

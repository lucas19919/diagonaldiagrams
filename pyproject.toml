[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diagonaldiagrams"
dynamic = ["version"]
description = "Charts and diagrams for agents: one command checks the spec, draws an SVG, and audits the layout."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Lucas Reimers" }]
maintainers = [{ name = "Lucas Reimers" }]
keywords = ["charts", "diagrams", "svg", "flowchart", "sequence-diagram", "mcp", "agents", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
png = ["cairosvg"]

[project.scripts]
diagonaldiagrams = "diagonaldiagrams.cli:cli"

[project.urls]
Homepage = "https://github.com/lucas19919/diagonaldiagrams"
Documentation = "https://lucas19919.github.io/diagonaldiagrams/"
Repository = "https://github.com/lucas19919/diagonaldiagrams"
Issues = "https://github.com/lucas19919/diagonaldiagrams/issues"

[tool.setuptools]
packages = ["diagonaldiagrams", "diagonaldiagrams.audit", "diagonaldiagrams.charts", "diagonaldiagrams.inputs",
            "diagonaldiagrams.layout", "diagonaldiagrams.route", "diagonaldiagrams.scene", "diagonaldiagrams.style",
            "diagonaldiagrams.text"]

[tool.setuptools.package-data]
"diagonaldiagrams" = ["web/*.js"]
"diagonaldiagrams.style" = ["themes/*.json", "presets/*.json"]

[tool.setuptools.dynamic]
version = { attr = "diagonaldiagrams.__version__" }

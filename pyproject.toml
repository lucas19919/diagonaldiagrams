[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diagonaldiagrams"
dynamic = ["version"]
description = "Charts and diagrams for agents: one command checks the spec, draws an SVG, and audits the layout."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Lucas Reimers" }]
keywords = ["charts", "diagrams", "svg", "flowchart", "mcp", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
png = ["cairosvg"]

[project.scripts]
diagonaldiagrams = "diagonaldiagrams.cli:cli"

[project.urls]
Homepage = "https://github.com/lucas19919/diagonaldiagrams"

[tool.setuptools]
packages = ["diagonaldiagrams", "diagonaldiagrams.audit", "diagonaldiagrams.charts", "diagonaldiagrams.inputs",
            "diagonaldiagrams.scene", "diagonaldiagrams.style", "diagonaldiagrams.text"]

[tool.setuptools.package-data]
"diagonaldiagrams.style" = ["themes/*.json", "presets/*.json"]

[tool.setuptools.dynamic]
version = { attr = "diagonaldiagrams.__version__" }

<svg xmlns="http://www.w3.org/2000/svg" role="graphics-document" aria-roledescription="flow diagram" data-legibility="all" viewBox="0 0 380 1126" width="380">
<title>Order processing</title>
<desc>From request received to order status updated.</desc>
<rect width="380" height="1126" fill="#f5f5f5" aria-hidden="true"/>
<defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#4f5d75"/></marker><marker id="aa" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#eb6c36"/></marker><marker id="al" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#2e5aa8"/></marker><marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#636c82"/></marker></defs>
<text x="30" y="26" font-size="18" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142">Order processing</text>
<text x="30" y="44" font-size="13" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75">From request received to order status updated.</text>
<rect x="174" y="72" width="144" height="40" rx="20" fill="#f5f5f5" aria-hidden="true"/>
<rect x="174" y="72" width="144" height="40" rx="20" fill="#ffffff" stroke="#7d8699" data-node="start" data-label="Request received" role="graphics-symbol" aria-roledescription="start or end" aria-label="Request received"/>
<text x="246" y="96.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Request received</text>
<rect x="190" y="160" width="112" height="40" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="190" y="160" width="112" height="40" rx="6" fill="#ffffff" stroke="#7d8699" data-node="load" data-label="Load account" role="graphics-symbol" aria-roledescription="box" aria-label="Load account"/>
<text x="246" y="184.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Load account</text>
<rect x="182" y="248" width="128" height="40" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="182" y="248" width="128" height="40" rx="6" fill="#ffffff" stroke="#7d8699" data-node="score" data-label="Score fraud risk" role="graphics-symbol" aria-roledescription="box" aria-label="Score fraud risk"/>
<text x="246" y="272.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Score fraud risk</text>
<polygon points="246,336 334,370.5 246,405 158,370.5" fill="#f5f5f5" aria-hidden="true"/>
<polygon points="246,336 334,370.5 246,405 158,370.5" fill="#ffffff" stroke="#7d8699" data-node="c1" data-label="Check 1 passed?" data-cx="246" data-cy="370.5" role="graphics-symbol" aria-roledescription="decision" aria-label="Check 1 passed?"/>
<text x="246" y="374.8" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Check 1 passed?</text>
<rect x="190" y="453" width="112" height="40" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="190" y="453" width="112" height="40" rx="6" fill="#ffffff" stroke="#7d8699" data-node="charge" data-label="Charge card" role="graphics-symbol" aria-roledescription="box" aria-label="Charge card"/>
<text x="246" y="477.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Charge card</text>
<rect x="174" y="541" width="144" height="40" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="174" y="541" width="144" height="40" rx="6" fill="#ffffff" stroke="#7d8699" data-node="ledger" data-label="Write ledger entry" role="graphics-symbol" aria-roledescription="box" aria-label="Write ledger entry"/>
<text x="246" y="565.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Write ledger entry</text>
<rect x="174" y="629" width="144" height="40" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="174" y="629" width="144" height="40" rx="6" fill="#ffffff" stroke="#7d8699" data-node="notify" data-label="Notify warehouse" role="graphics-symbol" aria-roledescription="box" aria-label="Notify warehouse"/>
<text x="246" y="653.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Notify warehouse</text>
<polygon points="246,717 334,751.5 246,786 158,751.5" fill="#f5f5f5" aria-hidden="true"/>
<polygon points="246,717 334,751.5 246,786 158,751.5" fill="#ffffff" stroke="#7d8699" data-node="c2" data-label="Check 2 passed?" data-cx="246" data-cy="751.5" role="graphics-symbol" aria-roledescription="decision" aria-label="Check 2 passed?"/>
<text x="246" y="755.8" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Check 2 passed?</text>
<rect x="190" y="834" width="112" height="40" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="190" y="834" width="112" height="40" rx="6" fill="#ffffff" stroke="#7d8699" data-node="receipt" data-label="Send receipt" role="graphics-symbol" aria-roledescription="box" aria-label="Send receipt"/>
<text x="246" y="858.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Send receipt</text>
<rect x="166" y="922" width="160" height="40" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="166" y="922" width="160" height="40" rx="6" fill="#ffffff" stroke="#7d8699" data-node="status" data-label="Update order status" role="graphics-symbol" aria-roledescription="box" aria-label="Update order status"/>
<text x="246" y="946.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Update order status</text>
<rect x="190" y="1022" width="112" height="40" rx="20" fill="#f5f5f5" aria-hidden="true"/>
<rect x="190" y="1022" width="112" height="40" rx="20" fill="#ffffff" stroke="#7d8699" data-node="end" data-label="Done" role="graphics-symbol" aria-roledescription="start or end" aria-label="Done"/>
<text x="246" y="1046.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Done</text>
<path d="M246,112 L246,160" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="start" data-to="load" data-label="" data-id="start-&gt;load" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Request received to Load account"/>
<path d="M246,200 L246,248" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="load" data-to="score" data-label="" data-id="load-&gt;score" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Load account to Score fraud risk"/>
<path d="M246,288 L246,336" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="score" data-to="c1" data-label="" data-id="score-&gt;c1" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Score fraud risk to Check 1 passed?"/>
<path d="M246,405 L246,453" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="c1" data-to="charge" data-label="yes" data-id="c1-&gt;charge:yes" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Check 1 passed? to Charge card: yes"/>
<path d="M334,370.5 L342,370.5 Q350,370.5 350,362.5 L350,188 Q350,180 342,180 L302,180" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="c1" data-to="load" data-label="no" data-id="c1-&gt;load:no" data-from-port="e" data-to-port="e" role="graphics-symbol" aria-roledescription="arrow" aria-label="Check 1 passed? to Load account: no"/>
<path d="M246,493 L246,541" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="charge" data-to="ledger" data-label="" data-id="charge-&gt;ledger" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Charge card to Write ledger entry"/>
<path d="M246,581 L246,629" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="ledger" data-to="notify" data-label="" data-id="ledger-&gt;notify" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Write ledger entry to Notify warehouse"/>
<path d="M246,669 L246,717" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="notify" data-to="c2" data-label="" data-id="notify-&gt;c2" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Notify warehouse to Check 2 passed?"/>
<path d="M246,786 L246,834" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="c2" data-to="receipt" data-label="yes" data-id="c2-&gt;receipt:yes" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Check 2 passed? to Send receipt: yes"/>
<path d="M158,751.5 L38,751.5 Q30,751.5 30,759.5 L30,984 Q30,992 38,992 L238,992 Q246,992 246,1000 L246,1022" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="c2" data-to="end" data-label="no" data-id="c2-&gt;end:no" data-from-port="w" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Check 2 passed? to Done: no"/>
<path d="M246,874 L246,922" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="receipt" data-to="status" data-label="" data-id="receipt-&gt;status" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Send receipt to Update order status"/>
<path d="M246,962 L246,1022" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="status" data-to="end" data-label="" data-id="status-&gt;end" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Update order status to Done"/>
<rect x="250" y="420" width="26" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="263" y="432" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">yes</text>
<rect x="354" y="266.25" width="20" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="364" y="278.25" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">no</text>
<rect x="250" y="801" width="26" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="263" y="813" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">yes</text>
<rect x="34" y="862.75" width="20" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="44" y="874.75" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">no</text>
<line x1="30" y1="1086" x2="350" y2="1086" stroke="rgba(45,49,66,0.12)" stroke-width=".8" aria-hidden="true"/>
<text x="30" y="1104" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75">box = step, diamond = decision, rounded = start or end</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" role="graphics-document" aria-roledescription="flow diagram" data-legibility="all" viewBox="0 0 522 585" width="522">
<title>Request handling</title>
<desc>Load the account, score fraud risk, retry from the start until the check passes.</desc>
<rect width="522" height="585" fill="#f5f5f5" aria-hidden="true"/>
<defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#4f5d75"/></marker><marker id="aa" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#eb6c36"/></marker><marker id="al" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#2e5aa8"/></marker><marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#636c82"/></marker></defs>
<text x="30" y="26" font-size="18" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142">Request handling</text>
<text x="30" y="44" font-size="13" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75">Load the account, score fraud risk, retry from the start until the check passes.</text>
<rect x="181" y="72" width="144" height="40" rx="20" fill="#f5f5f5" aria-hidden="true"/>
<rect x="181" y="72" width="144" height="40" rx="20" fill="#ffffff" stroke="#7d8699" data-node="start" data-label="Request received" role="graphics-symbol" aria-roledescription="start or end" aria-label="Request received"/>
<text x="253" y="96.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Request received</text>
<rect x="165" y="160" width="176" height="54" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="165" y="160" width="176" height="54" rx="6" fill="#ffffff" stroke="#7d8699" data-node="load" data-label="Load customer account" role="graphics-symbol" aria-roledescription="box" aria-label="Load customer account, step 1"/>
<text x="253" y="183.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Load customer account</text>
<text x="253" y="200.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">step 1</text>
<rect x="189" y="262" width="128" height="54" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="189" y="262" width="128" height="54" rx="6" fill="#ffffff" stroke="#7d8699" data-node="score" data-label="Score fraud risk" role="graphics-symbol" aria-roledescription="box" aria-label="Score fraud risk, step 2"/>
<text x="253" y="285.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Score fraud risk</text>
<text x="253" y="302.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">step 2</text>
<polygon points="253,364 341,398.5 253,433 165,398.5" fill="#f5f5f5" aria-hidden="true"/>
<polygon points="253,364 341,398.5 253,433 165,398.5" fill="#ffffff" stroke="#7d8699" data-node="check" data-label="Check 1 passed?" data-cx="253" data-cy="398.5" role="graphics-symbol" aria-roledescription="decision" aria-label="Check 1 passed?"/>
<text x="253" y="402.8" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Check 1 passed?</text>
<rect x="197" y="481" width="112" height="40" rx="20" fill="#f5f5f5" aria-hidden="true"/>
<rect x="197" y="481" width="112" height="40" rx="20" fill="#ffffff" stroke="#7d8699" data-node="end" data-label="Done" role="graphics-symbol" aria-roledescription="start or end" aria-label="Done"/>
<text x="253" y="505.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Done</text>
<path d="M253,112 L253,160" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="start" data-to="load" data-label="" data-id="start-&gt;load" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Request received to Load customer account"/>
<path d="M253,214 L253,262" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="load" data-to="score" data-label="" data-id="load-&gt;score" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Load customer account to Score fraud risk"/>
<path d="M253,316 L253,364" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="score" data-to="check" data-label="" data-id="score-&gt;check" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Score fraud risk to Check 1 passed?"/>
<path d="M253,433 L253,481" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#aa)" data-from="check" data-to="end" data-label="yes" data-id="check-&gt;end:yes" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Check 1 passed? to Done: yes"/>
<path d="M341,398.5 L349,398.5 Q357,398.5 357,390.5 L357,195 Q357,187 349,187 L341,187" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="check" data-to="load" data-label="no" data-id="check-&gt;load:no" data-from-port="e" data-to-port="e" role="graphics-symbol" aria-roledescription="arrow" aria-label="Check 1 passed? to Load customer account: no"/>
<rect x="257" y="448" width="26" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="270" y="460" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">yes</text>
<rect x="361" y="283.75" width="20" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="371" y="295.75" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">no</text>
<line x1="30" y1="545" x2="492" y2="545" stroke="rgba(45,49,66,0.12)" stroke-width=".8" aria-hidden="true"/>
<text x="30" y="563" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75">box = step, diamond = decision, rounded = start or end</text>
</svg>
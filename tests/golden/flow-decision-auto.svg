<rect x="307" y="167" width="30" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="322" y="179" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">retry</text>
<rect x="186" y="466" width="46" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>

<svg xmlns="http://www.w3.org/2000/svg" role="graphics-document" aria-roledescription="flow diagram" data-legibility="all" viewBox="0 0 360 623" width="360">
<title>Deploy approval</title>
<desc>Yes = right · No = down · diamond &lt;= 3 exits</desc>
<rect width="360" height="623" fill="#f5f5f5" aria-hidden="true"/>
<defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#4f5d75"/></marker><marker id="aa" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#eb6c36"/></marker><marker id="al" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#2e5aa8"/></marker><marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#636c82"/></marker></defs>
<text x="30" y="26" font-size="18" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142">Deploy approval</text>
<text x="30" y="44" font-size="13" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75">Yes = right · No = down · diamond &lt;= 3 exits</text>
<rect x="126" y="72" width="112" height="40" rx="20" fill="#f5f5f5" aria-hidden="true"/>
<rect x="126" y="72" width="112" height="40" rx="20" fill="#ffffff" stroke="#7d8699" data-node="start" data-label="Push" role="graphics-symbol" aria-roledescription="start or end" aria-label="Push"/>
<text x="182" y="96.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Push</text>
<rect x="126" y="160" width="112" height="54" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="126" y="160" width="112" height="54" rx="6" fill="#ffffff" stroke="#7d8699" data-node="tests" data-label="CI tests" role="graphics-symbol" aria-roledescription="box" aria-label="CI tests, ci: 4 min"/>
<text x="182" y="183.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">CI tests</text>
<text x="182" y="200.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">ci: 4 min</text>
<polygon points="106,274 162,308.5 106,343 50,308.5" fill="#f5f5f5" aria-hidden="true"/>
<polygon points="106,274 162,308.5 106,343 50,308.5" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" data-node="risk?" data-label="Risky?" data-cx="106" data-cy="308.5" role="graphics-symbol" aria-roledescription="decision" aria-label="Risky?"/>
<text x="106" y="312.8" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Risky?</text>
<rect x="202" y="288.5" width="112" height="40" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="202" y="288.5" width="112" height="40" rx="6" fill="#ffffff" stroke="#7d8699" data-node="fix" data-label="Fix" role="graphics-symbol" aria-roledescription="box" aria-label="Fix"/>
<text x="258" y="313.2" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Fix</text>
<rect x="126" y="391" width="112" height="54" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="126" y="391" width="112" height="54" rx="6" fill="#ffffff" stroke="#7d8699" data-node="review" data-label="Review" role="graphics-symbol" aria-roledescription="box" aria-label="Review, owner:payments"/>
<text x="182" y="414.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Review</text>
<text x="182" y="431.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">owner:payments</text>
<rect x="50" y="519" width="112" height="40" rx="20" fill="#f5f5f5" aria-hidden="true"/>
<rect x="50" y="519" width="112" height="40" rx="20" fill="#ffffff" stroke="#7d8699" data-node="ship" data-label="Ship" role="graphics-symbol" aria-roledescription="start or end" aria-label="Ship"/>
<text x="106" y="543.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Ship</text>
<path d="M182,112 L182,160" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#aa)" data-from="start" data-to="tests" data-label="push" data-id="start-&gt;tests:push" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Push to CI tests: push"/>
<path d="M182,214 L182,236 Q182,244 174,244 L114,244 Q106,244 106,252 L106,274" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="tests" data-to="risk?" data-label="pass" data-id="tests-&gt;risk?:pass" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="CI tests to Risky?: pass"/>
<path d="M182,214 L182,236 Q182,244 190,244 L238,244 Q246,244 246,252 L246,288.5" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="tests" data-to="fix" data-label="fail" data-id="tests-&gt;fix:fail" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="CI tests to Fix: fail"/>
<path d="M162,308.5 L166,308.5 Q170,308.5 170,312.5 L170,391" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#aa)" data-from="risk?" data-to="review" data-label="yes" data-id="risk?-&gt;review:yes" data-from-port="e" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Risky? to Review: yes"/>
<path d="M50,308.5 L38,308.5 Q30,308.5 30,316.5 L30,467 Q30,475 38,475 L98,475 Q106,475 106,483 L106,519" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="risk?" data-to="ship" data-label="no" data-id="risk?-&gt;ship:no" data-from-port="w" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Risky? to Ship: no"/>
<path d="M314,308.5 L322,308.5 Q330,308.5 330,300.5 L330,195 Q330,187 322,187 L238,187" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="fix" data-to="tests" data-label="retry" data-id="fix-&gt;tests:retry" data-from-port="e" data-to-port="e" role="graphics-symbol" aria-roledescription="arrow" aria-label="Fix to CI tests: retry"/>
<path d="M170,445 L170,481 Q170,489 162,489 L114,489 Q106,489 106,497 L106,519" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="review" data-to="ship" data-label="approve" data-id="review-&gt;ship:approve" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Review to Ship: approve"/>
<rect x="186" y="127" width="31" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="201.5" y="139" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">push</text>
<rect x="128.5" y="224" width="31" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="144" y="236" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">pass</text>
<rect x="202" y="224" width="24" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="214" y="236" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">fail</text>
<rect x="174" y="340.75" width="26" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="187" y="352.75" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">yes</text>
<rect x="34" y="382.75" width="20" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="44" y="394.75" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">no</text>
<rect x="296" y="238.75" width="30" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="311" y="250.75" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">retry</text>
<rect x="115" y="469" width="46" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="138" y="481" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">approve</text>
<line x1="30" y1="583" x2="330" y2="583" stroke="rgba(45,49,66,0.12)" stroke-width=".8" aria-hidden="true"/>
<text x="30" y="601" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75">box = step, diamond = decision, rounded = start or end</text>
</svg>
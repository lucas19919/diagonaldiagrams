<path d="M390,308.5 L398,308.5 Q406,308.5 406,300.5 L406,195 Q406,187 398,187 L238,187" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="fix" data-to="tests" data-label="retry" data-id="fix-&gt;tests:retry" data-from-port="e" data-to-port="e" role="graphics-symbol" aria-roledescription="arrow" aria-label="Fix to CI tests: retry"/>
<path d="M182,445 L182,505" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="review" data-to="ship" data-label="approve" data-id="review-&gt;ship:approve" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Review to Ship: approve"/>

<rect x="334" y="361" width="192" height="40" rx="6" fill="#ffffff" stroke="#7d8699" data-node="X" data-label="Tell the agent what to fix" role="graphics-symbol" aria-roledescription="box" aria-label="Tell the agent what to fix"/>
<text x="430" y="385.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Tell the agent what to fix</text>

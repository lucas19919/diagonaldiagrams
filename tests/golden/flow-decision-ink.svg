<text x="222" y="236" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#bfc0c0" text-anchor="middle" aria-hidden="true">fail</text>
<rect x="346" y="358" width="26" height="16" rx="2" fill="#2d3142" aria-hidden="true"/>
<text x="359" y="370" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#bfc0c0" text-anchor="middle" aria-hidden="true">yes</text>
<rect x="194" y="382.75" width="20" height="16" rx="2" fill="#2d3142" aria-hidden="true"/>
<text x="204" y="394.75" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#bfc0c0" text-anchor="middle" aria-hidden="true">no</text>
<rect x="143" y="167" width="30" height="16" rx="2" fill="#2d3142" aria-hidden="true"/>
<text x="158" y="179" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#bfc0c0" text-anchor="middle" aria-hidden="true">retry</text>
<rect x="346" y="466" width="46" height="16" rx="2" fill="#2d3142" aria-hidden="true"/>
<text x="369" y="478" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#bfc0c0" text-anchor="middle" aria-hidden="true">approve</text>
<line x1="30" y1="569" x2="398" y2="569" stroke="rgba(245,245,245,0.14)" stroke-width=".8" aria-hidden="true"/>
<text x="30" y="587" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#bfc0c0">box = step, diamond = decision, rounded = start or end</text>

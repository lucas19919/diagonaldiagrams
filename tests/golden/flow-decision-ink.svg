<svg xmlns="http://www.w3.org/2000/svg" role="graphics-document" aria-roledescription="flow diagram" data-legibility="all" viewBox="0 0 428 609" width="428">
<title>Deploy approval</title>
<desc>Yes = right · No = down · diamond &lt;= 3 exits</desc>
<rect width="428" height="609" fill="#2d3142" aria-hidden="true"/>
<defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#bfc0c0"/></marker><marker id="aa" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#f08a59"/></marker><marker id="al" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#6a95d8"/></marker><marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#aab2c4"/></marker></defs>
<text x="30" y="26" font-size="18" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#f5f5f5">Deploy approval</text>
<text x="30" y="44" font-size="13" font-family="system-ui, 'Segoe UI', sans-serif" fill="#bfc0c0">Yes = right · No = down · diamond &lt;= 3 exits</text>
<rect x="286" y="72" width="112" height="40" rx="20" fill="#2d3142" aria-hidden="true"/>
<rect x="286" y="72" width="112" height="40" rx="20" fill="#393e53" stroke="#868fa5" data-node="start" data-label="Push" role="graphics-symbol" aria-roledescription="start or end" aria-label="Push"/>
<text x="342" y="96.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#f5f5f5" text-anchor="middle" aria-hidden="true">Push</text>

<path d="M46,418 L38,418 Q30,418 30,410 L30,195 Q30,187 38,187 L286,187" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#a)" data-from="fix" data-to="tests" data-label="retry" data-id="fix-&gt;tests:retry" data-from-port="w" data-to-port="w" role="graphics-symbol" aria-roledescription="arrow" aria-label="Fix to CI tests: retry"/>
<path d="M342,445 L342,505" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#a)" data-from="review" data-to="ship" data-label="approve" data-id="review-&gt;ship:approve" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Review to Ship: approve"/>

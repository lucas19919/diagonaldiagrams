<svg xmlns="http://www.w3.org/2000/svg" role="graphics-document" aria-roledescription="flow diagram" viewBox="0 0 720 718" width="720">
<title>A 5-step process</title>
<desc>Generated for the golden corpus.</desc>
<rect width="720" height="718" fill="#f5f5f5" aria-hidden="true"/>
<defs><marker id="a" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,12 4.5,0 9" fill="#4f5d75"/></marker><marker id="aa" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,12 4.5,0 9" fill="#eb6c36"/></marker><marker id="al" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,12 4.5,0 9" fill="#2e5aa8"/></marker><marker id="ar" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,12 4.5,0 9" fill="#7a8399"/></marker></defs>
<text x="30" y="26" font-size="18" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142">A 5-step process</text>
<text x="30" y="44" font-size="13" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75">Generated for the golden corpus.</text>
<rect x="264" y="90" width="160" height="56" rx="20" fill="#f5f5f5" aria-hidden="true"/>
<rect x="264" y="90" width="160" height="56" rx="20" fill="#ffffff" stroke="#2d3142" data-node="s0" data-label="Request received" role="graphics-symbol" aria-roledescription="start or end" aria-label="Request received"/>
<text x="344" y="121.5" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Request received</text>
<rect x="264" y="210" width="160" height="56" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="264" y="210" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" data-node="s1" data-label="Load the customer account (1)" role="graphics-symbol" aria-roledescription="box" aria-label="Load the customer account (1)"/>
<text x="344" y="234" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Load the customer</text>
<text x="344" y="249" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">account (1)</text>
<rect x="264" y="330" width="160" height="56" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="264" y="330" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" data-node="s2" data-label="Score the fraud risk (2)" role="graphics-symbol" aria-roledescription="box" aria-label="Score the fraud risk (2)"/>
<text x="344" y="361.5" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Score the fraud risk (2)</text>
<polygon points="344,450 424,482 344,514 264,482" fill="#f5f5f5" aria-hidden="true"/>
<polygon points="344,450 424,482 344,514 264,482" fill="#ffffff" stroke="#2d3142" data-node="s3" data-label="Check 1 passed?" data-cx="344" data-cy="482" role="graphics-symbol" aria-roledescription="decision" aria-label="Check 1 passed?"/>
<text x="344" y="486" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Check 1 passed?</text>
<rect x="264" y="578" width="160" height="56" rx="20" fill="#f5f5f5" aria-hidden="true"/>
<rect x="264" y="578" width="160" height="56" rx="20" fill="#ffffff" stroke="#2d3142" data-node="s4" data-label="Done" role="graphics-symbol" aria-roledescription="start or end" aria-label="Done"/>
<text x="344" y="609.5" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Done</text>
<path d="M344,146 L344,210" fill="none" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#a)" data-from="s0" data-to="s1" data-label="" data-id="s0-&gt;s1" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Request received to Load the customer account (1)"/>
<circle cx="344" cy="153" r="2.7" fill="#4f5d75" aria-hidden="true"/>
<path d="M344,266 L344,330" fill="none" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#a)" data-from="s1" data-to="s2" data-label="" data-id="s1-&gt;s2" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Load the customer account (1) to Score the fraud risk (2)"/>
<circle cx="344" cy="273" r="2.7" fill="#4f5d75" aria-hidden="true"/>
<path d="M344,386 L344,450" fill="none" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#a)" data-from="s2" data-to="s3" data-label="" data-id="s2-&gt;s3" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Score the fraud risk (2) to Check 1 passed?"/>
<circle cx="344" cy="393" r="2.7" fill="#4f5d75" aria-hidden="true"/>
<path d="M424,482 L448,482 Q456,482 456,474 L456,246 Q456,238 448,238 L424,238" fill="none" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#a)" data-from="s3" data-to="s1" data-label="no" data-id="s3-&gt;s1:no" data-from-port="e" data-to-port="e" role="graphics-symbol" aria-roledescription="arrow" aria-label="Check 1 passed? to Load the customer account (1): no"/>
<circle cx="431" cy="482" r="2.7" fill="#4f5d75" aria-hidden="true"/>
<path d="M344,514 L344,578" fill="none" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#a)" data-from="s3" data-to="s4" data-label="yes" data-id="s3-&gt;s4:yes" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Check 1 passed? to Done: yes"/>
<circle cx="344" cy="521" r="2.7" fill="#4f5d75" aria-hidden="true"/>
<rect x="464" y="351" width="40" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="484" y="363" font-size="10" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">no</text>
<rect x="352" y="537" width="40" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="372" y="549" font-size="10" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">yes</text>
<line x1="30" y1="670" x2="690" y2="670" stroke="rgba(45,49,66,0.12)" stroke-width=".8" aria-hidden="true"/>
<text x="30" y="686" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75">box = step, diamond = decision, rounded = start or end</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" role="graphics-document" aria-roledescription="flow diagram" viewBox="0 0 720 712" width="720">
<title>A 5-step process</title>
<desc>Generated for the golden corpus.</desc>
<rect width="720" height="712" fill="#f5f5f5" aria-hidden="true"/>
<defs><marker id="a" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,12 4.5,0 9" fill="#4f5d75"/></marker><marker id="aa" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,12 4.5,0 9" fill="#eb6c36"/></marker><marker id="al" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,12 4.5,0 9" fill="#2e5aa8"/></marker><marker id="ar" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,12 4.5,0 9" fill="#7a8399"/></marker></defs>
<text x="30" y="26" font-size="18" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142">A 5-step process</text>
<text x="30" y="44" font-size="13" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75">Generated for the golden corpus.</text>
<rect x="280" y="92" width="160" height="56" rx="20" fill="#f5f5f5" aria-hidden="true"/>
<rect x="280" y="92" width="160" height="56" rx="20" fill="#ffffff" stroke="#2d3142" data-node="s0" data-label="Request received" role="graphics-symbol" aria-roledescription="start or end" aria-label="Request received"/>
<text x="360" y="123.5" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Request received</text>
<rect x="280" y="212" width="160" height="56" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="280" y="212" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" data-node="s1" data-label="Load the customer account (1)" role="graphics-symbol" aria-roledescription="box" aria-label="Load the customer account (1)"/>
<text x="360" y="236" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Load the customer</text>
<text x="360" y="251" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">account (1)</text>
<rect x="280" y="332" width="160" height="56" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="280" y="332" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" data-node="s2" data-label="Score the fraud risk (2)" role="graphics-symbol" aria-roledescription="box" aria-label="Score the fraud risk (2)"/>
<text x="360" y="363.5" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Score the fraud risk (2)</text>
<polygon points="360,448 440,480 360,512 280,480" fill="#f5f5f5" aria-hidden="true"/>
<polygon points="360,448 440,480 360,512 280,480" fill="#ffffff" stroke="#2d3142" data-node="s3" data-label="Check 1 passed?" data-cx="360" data-cy="480" role="graphics-symbol" aria-roledescription="decision" aria-label="Check 1 passed?"/>
<text x="360" y="484" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Check 1 passed?</text>
<rect x="280" y="572" width="160" height="56" rx="20" fill="#f5f5f5" aria-hidden="true"/>
<rect x="280" y="572" width="160" height="56" rx="20" fill="#ffffff" stroke="#2d3142" data-node="s4" data-label="Done" role="graphics-symbol" aria-roledescription="start or end" aria-label="Done"/>
<text x="360" y="603.5" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Done</text>
<path d="M360,148 L360,212" fill="none" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#a)" data-from="s0" data-to="s1" data-label="" data-id="s0-&gt;s1" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Request received to Load the customer account (1)"/>
<circle cx="360" cy="155" r="2.7" fill="#4f5d75" aria-hidden="true"/>
<path d="M360,268 L360,332" fill="none" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#a)" data-from="s1" data-to="s2" data-label="" data-id="s1-&gt;s2" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Load the customer account (1) to Score the fraud risk (2)"/>
<circle cx="360" cy="275" r="2.7" fill="#4f5d75" aria-hidden="true"/>
<path d="M360,388 L360,448" fill="none" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#a)" data-from="s2" data-to="s3" data-label="" data-id="s2-&gt;s3" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Score the fraud risk (2) to Check 1 passed?"/>
<circle cx="360" cy="395" r="2.7" fill="#4f5d75" aria-hidden="true"/>
<path d="M280,480 L272,480 Q264,480 264,472 L264,248 Q264,240 272,240 L280,240" fill="none" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#a)" data-from="s3" data-to="s1" data-label="no" data-id="s3-&gt;s1:no" data-from-port="w" data-to-port="w" role="graphics-symbol" aria-roledescription="arrow" aria-label="Check 1 passed? to Load the customer account (1): no"/>
<circle cx="273" cy="480" r="2.7" fill="#4f5d75" aria-hidden="true"/>
<rect x="216" y="317" width="40" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="236" y="329" font-size="10" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">NO</text>
<path d="M360,512 L360,572" fill="none" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#a)" data-from="s3" data-to="s4" data-label="yes" data-id="s3-&gt;s4:yes" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Check 1 passed? to Done: yes"/>
<circle cx="360" cy="519" r="2.7" fill="#4f5d75" aria-hidden="true"/>
<rect x="368" y="533" width="40" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="388" y="545" font-size="10" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">YES</text>
<line x1="30" y1="664" x2="690" y2="664" stroke="rgba(45,49,66,0.12)" stroke-width=".8" aria-hidden="true"/>
<text x="30" y="680" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75">box = step, diamond = decision, rounded = start or end</text>
</svg>
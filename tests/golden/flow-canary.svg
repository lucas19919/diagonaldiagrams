<path d="M142.5,398.5 L190.5,398.5" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="slo" data-to="rollback" data-label="no" data-id="slo-&gt;rollback:no" data-from-port="e" data-to-port="w" role="graphics-symbol" aria-roledescription="arrow" aria-label="SLO hold? to Roll back: no"/>
<path d="M190.5,385 L182.5,385 Q174.5,385 174.5,377 L174.5,195 Q174.5,187 166.5,187 L142.5,187" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="rollback" data-to="build" data-label="patch" data-id="rollback-&gt;build:patch" data-from-port="w" data-to-port="e" role="graphics-symbol" aria-roledescription="arrow" aria-label="Roll back to Bake image: patch"/>
<path d="M86.5,535 L86.5,583" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="promote" data-to="observe" data-label="ramp" data-id="promote-&gt;observe:ramp" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Promote to Observe: ramp"/>
<path d="M86.5,637 L86.5,685" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="observe" data-to="steady" data-label="hold" data-id="observe-&gt;steady:hold" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Observe to Steady: hold"/>

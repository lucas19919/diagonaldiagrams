<rect x="176" y="707" width="160" height="59" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="176" y="707" width="160" height="59" rx="6" fill="#ffffff" stroke="#2d3142" data-node="observe" data-label="Observe" role="graphics-symbol" aria-roledescription="box" aria-label="Observe, 1 hour"/>
<rect x="184" y="713" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity=".4" stroke-width=".8" aria-hidden="true"/>
<text x="198" y="722" font-size="8" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">STEP</text>
<text x="256" y="739" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Observe</text>
<text x="256" y="756" font-size="9" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">1 hour</text>
<rect x="176" y="830" width="160" height="56" rx="20" fill="#f5f5f5" aria-hidden="true"/>
<rect x="176" y="830" width="160" height="56" rx="20" fill="#ffffff" stroke="#2d3142" data-node="steady" data-label="Steady" role="graphics-symbol" aria-roledescription="start or end" aria-label="Steady"/>
<rect x="184" y="836" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity=".4" stroke-width=".8" aria-hidden="true"/>
<text x="198" y="845" font-size="8" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">END</text>
<text x="256" y="867.5" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Steady</text>
<path d="M256,146 L256,210" fill="none" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#a)" data-from="merge" data-to="build" data-label="land" data-id="merge-&gt;build:land" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Merge to Bake image: land"/>

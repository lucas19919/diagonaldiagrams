<text x="198" y="225" font-size="8" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">STEP</text>
<text x="256" y="242" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Bake image</text>
<text x="256" y="259" font-size="9" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">sha 8f3c</text>
<rect x="176" y="333" width="160" height="59" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="176" y="333" width="160" height="59" rx="6" fill="#ffffff" stroke="#2d3142" data-node="canary" data-label="Canary 5%" role="graphics-symbol" aria-roledescription="box" aria-label="Canary 5%, 15 min"/>
<rect x="184" y="339" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity=".4" stroke-width=".8" aria-hidden="true"/>

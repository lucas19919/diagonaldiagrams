<text x="256" y="127.5" font-size="12" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Merge</text>
<rect x="176" y="210" width="160" height="59" rx="6" fill="#f5f5f5" aria-hidden="true"/>
<rect x="176" y="210" width="160" height="59" rx="6" fill="#ffffff" stroke="#2d3142" data-node="build" data-label="Bake image" role="graphics-symbol" aria-roledescription="box" aria-label="Bake image, sha 8f3c"/>

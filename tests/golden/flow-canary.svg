<svg xmlns="http://www.w3.org/2000/svg" role="graphics-document" aria-roledescription="flow diagram" viewBox="0 0 720 970" width="720">
<title>Canary promotion</title>
<desc>Yes promotes. No rolls back into the build.</desc>
<rect width="720" height="970" fill="#f5f5f5" aria-hidden="true"/>
<defs><marker id="a" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,12 4.5,0 9" fill="#4f5d75"/></marker><marker id="aa" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,12 4.5,0 9" fill="#eb6c36"/></marker><marker id="al" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,12 4.5,0 9" fill="#2e5aa8"/></marker><marker id="ar" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,12 4.5,0 9" fill="#7a8399"/></marker></defs>
<text x="30" y="26" font-size="18" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142">Canary promotion</text>
<text x="30" y="44" font-size="13" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75">Yes promotes. No rolls back into the build.</text>
<rect x="176" y="90" width="160" height="56" rx="20" fill="#f5f5f5" aria-hidden="true"/>
<rect x="176" y="90" width="160" height="56" rx="20" fill="#ffffff" stroke="#2d3142" data-node="merge" data-label="Merge" role="graphics-symbol" aria-roledescription="start or end" aria-label="Merge"/>

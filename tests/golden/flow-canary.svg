<text x="86.5" y="96.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Merge</text>
<rect x="30.5" y="160" width="112" height="54" rx="6" fill="#f5f5f5" aria-hidden="true"/>

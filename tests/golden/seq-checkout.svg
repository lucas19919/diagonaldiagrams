<svg xmlns="http://www.w3.org/2000/svg" role="graphics-document" aria-roledescription="sequence diagram" viewBox="0 0 1084 672" width="1084">
<title>Order Checkout Sequence</title>
<desc>Synchronous payment authorization with asynchronous receipt notification</desc>

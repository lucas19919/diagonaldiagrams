<text x="266" y="543.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Ship</text>
<path d="M222,112 L222,160" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#aa)" data-from="start" data-to="tests" data-label="push" data-id="start-&gt;tests:push" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Push to CI tests: push"/>

<line x1="30" y1="664" x2="690" y2="664" stroke="rgba(45,49,66,0.12)" stroke-width=".8" aria-hidden="true"/>
<text x="30" y="680" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75">box = step, diamond = decision, rounded = start or end</text>
</svg>
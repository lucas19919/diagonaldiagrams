<rect x="40" y="452" width="160" height="56" rx="0" fill="#ffffff" stroke="#2d3142" data-node="fix" data-label="Fix" role="graphics-symbol" aria-roledescription="box" aria-label="Fix"/>
<rect x="48" y="458" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity=".4" stroke-width=".8" aria-hidden="true"/>

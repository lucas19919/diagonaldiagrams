<text x="244" y="236" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">pass</text>
<rect x="106" y="312" width="24" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="118" y="324" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">fail</text>
<rect x="334" y="340.75" width="26" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="347" y="352.75" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">yes</text>
<rect x="194" y="382.75" width="20" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="204" y="394.75" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">no</text>
<rect x="34" y="293.5" width="30" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="49" y="305.5" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">retry</text>
<rect x="275" y="469" width="46" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="298" y="481" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">approve</text>
<line x1="30" y1="583" x2="398" y2="583" stroke="rgba(45,49,66,0.12)" stroke-width=".8" aria-hidden="true"/>
<text x="30" y="601" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75">box = step, diamond = decision, rounded = start or end</text>
</svg>
<path d="M600,509.5 L600,532.8 Q600,540.8 592,540.8 L368,540.8 Q360,540.8 360,548.8 L360,572" fill="none" stroke="#4f5d75" stroke-width="1.8" marker-end="url(#a)" data-from="review" data-to="ship" data-label="approve" data-id="review-&gt;ship:approve" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Review to Ship: approve"/>
<circle cx="600" cy="516.5" r="2.7" fill="#4f5d75" aria-hidden="true"/>
<rect x="452" y="516.75" width="56" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>

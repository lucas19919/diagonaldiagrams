<svg xmlns="http://www.w3.org/2000/svg" role="graphics-document" aria-roledescription="flow diagram" data-legibility="all" viewBox="0 0 428 623" width="428">
<title>Deploy approval</title>
<desc>Yes = right · No = down · diamond &lt;= 3 exits</desc>
<rect width="428" height="623" fill="#f5f5f5" aria-hidden="true"/>
<defs><marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#4f5d75"/></marker><marker id="aa" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#eb6c36"/></marker><marker id="al" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#2e5aa8"/></marker><marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,10 3.5,0 7,2 3.5" fill="#636c82"/></marker></defs>
<text x="30" y="26" font-size="18" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142">Deploy approval</text>
<text x="30" y="44" font-size="13" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75">Yes = right · No = down · diamond &lt;= 3 exits</text>
<rect x="166" y="72" width="112" height="40" rx="20" fill="#f5f5f5" aria-hidden="true"/>
<rect x="166" y="72" width="112" height="40" rx="20" fill="#ffffff" stroke="#7d8699" data-node="start" data-label="Push" role="graphics-symbol" aria-roledescription="start or end" aria-label="Push"/>
<text x="222" y="96.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Push</text>
<rect x="166" y="160" width="112" height="54" rx="0" fill="#f5f5f5" aria-hidden="true"/>
<rect x="166" y="160" width="112" height="54" rx="0" fill="#ffffff" stroke="#7d8699" data-node="tests" data-label="CI tests" role="graphics-symbol" aria-roledescription="box" aria-label="CI tests, ci: 4 min"/>
<text x="222" y="183.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">CI tests</text>
<text x="222" y="200.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">ci: 4 min</text>
<polygon points="266,274 322,308.5 266,343 210,308.5" fill="#f5f5f5" aria-hidden="true"/>

<circle cx="273" cy="252.75" r="2.7" fill="#4f5d75" aria-hidden="true"/>
<rect x="192" y="357.38" width="40" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>
<text x="212" y="369.38" font-size="10" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">FAIL</text>
<path d="M440,360 L472,360 Q480,360 480,368 L480,472 Q480,480 488,480 L520,480" fill="none" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#aa)" data-from="risk?" data-to="review" data-label="yes" data-id="risk?-&gt;review:yes" data-from-port="e" data-to-port="w" role="graphics-symbol" aria-roledescription="arrow" aria-label="Risky? to Review: yes"/>

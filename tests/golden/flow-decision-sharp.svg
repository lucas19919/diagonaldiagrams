<text x="266" y="312.8" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Risky?</text>
<rect x="46" y="398" width="112" height="40" rx="0" fill="#f5f5f5" aria-hidden="true"/>
<rect x="46" y="398" width="112" height="40" rx="0" fill="#ffffff" stroke="#7d8699" data-node="fix" data-label="Fix" role="graphics-symbol" aria-roledescription="box" aria-label="Fix"/>
<text x="102" y="422.7" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Fix</text>
<rect x="286" y="391" width="112" height="54" rx="0" fill="#f5f5f5" aria-hidden="true"/>
<rect x="286" y="391" width="112" height="54" rx="0" fill="#ffffff" stroke="#7d8699" data-node="review" data-label="Review" role="graphics-symbol" aria-roledescription="box" aria-label="Review, owner:payments"/>
<text x="342" y="414.3" font-size="13" font-weight="600" font-family="system-ui, 'Segoe UI', sans-serif" fill="#2d3142" text-anchor="middle" aria-hidden="true">Review</text>
<text x="342" y="431.1" font-size="11" font-family="system-ui, 'Segoe UI', sans-serif" fill="#4f5d75" text-anchor="middle" aria-hidden="true">owner:payments</text>

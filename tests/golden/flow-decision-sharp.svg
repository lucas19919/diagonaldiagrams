<path d="M46,418 L38,418 Q30,418 30,410 L30,195 Q30,187 38,187 L166,187" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="fix" data-to="tests" data-label="retry" data-id="fix-&gt;tests:retry" data-from-port="w" data-to-port="w" role="graphics-symbol" aria-roledescription="arrow" aria-label="Fix to CI tests: retry"/>
<path d="M330,445 L330,481 Q330,489 322,489 L274,489 Q266,489 266,497 L266,519" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#a)" data-from="review" data-to="ship" data-label="approve" data-id="review-&gt;ship:approve" data-from-port="s" data-to-port="n" role="graphics-symbol" aria-roledescription="arrow" aria-label="Review to Ship: approve"/>
<rect x="226" y="127" width="31" height="16" rx="2" fill="#f5f5f5" aria-hidden="true"/>

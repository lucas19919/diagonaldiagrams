<svg xmlns="http://www.w3.org/2000/svg" role="graphics-document" aria-roledescription="sequence diagram" viewBox="0 0 1000 880" width="1000">
<title>Tool loop</title>
<desc>The model asks, the tool answers, the ledger keeps the trace.</desc>
